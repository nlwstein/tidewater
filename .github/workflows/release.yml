# Cuts a release when main moves: works out the next version from the conventional commits since the last v* tag
# (.github/scripts/release.py), builds the downloads (desktop, the unsigned iOS IPA, and the Android APK when its signing secrets are set), then creates the tag and the GitHub release in this one workflow
# (a tag made with GITHUB_TOKEN would not start another one). How it works: docs/release.md. Tests run in ci.yml, not
# here. Only the program is packaged: never any game data.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and smoke-test everything but publish nothing (no tag, no release)"
        type: boolean
        default: true

# One release at a time; a second push waits instead of racing the first for the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The update check asks this repository for newer releases (crates/client/src/update.rs).
  TIDEWATER_REPO: ${{ github.repository }}

# The same named runner images as ci.yml: the Linux image sets the oldest glibc the tarball runs on.
jobs:
  # Decides whether there is anything to release, and which version.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags and the history since the last one
      - name: Test the release script
        run: python3 -m unittest discover -s .github/scripts
      - name: Work out the version
        id: v
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          next=$(python3 .github/scripts/release.py version)
          dry="$DRY_RUN"
          # Only main publishes; a manual run from another branch can only be a dry run.
          publish=false
          if [ -n "$next" ] && [ "$dry" != true ] && [ "$GITHUB_REF" = refs/heads/main ]; then publish=true; fi
          build=$publish
          if [ "$dry" = true ]; then
            build=true
            # Nothing releasable: still build something to look at, with a version that never offers updates.
            [ -n "$next" ] || next=0.0.0-dryrun
          fi
          {
            echo "version=$next"
            echo "build=$build"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Release plan"
            echo
            if [ -z "$next" ]; then
              echo "Nothing to release: no feat, fix or perf commit since the last tag."
            else
              echo "- Version: **$next**"
              echo "- Build: $build, publish: $publish (dry run: $dry)"
              echo
              python3 .github/scripts/release.py notes
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  linux:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    # The oldest Ubuntu runner: the tarball and the AppImage need the glibc they were built against (2.35) or newer.
    runs-on: ubuntu-22.04
    env:
      TIDEWATER_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install SDL 3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libegl1-mesa-dev libgl1-mesa-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p tidewater-client
      - name: Package
        run: |
          mkdir -p dist
          packaging/linux/build-tarball.sh "$TIDEWATER_VERSION" target/release/tidewater \
            "dist/tidewater-${TIDEWATER_VERSION}-linux-x64.tar.gz"
          # The AppImage (Steam Deck and other Linux systems), built on this runner so its glibc sets the oldest system it runs on.
          packaging/linux/appimage.sh "$TIDEWATER_VERSION" target/release/tidewater \
            "dist/tidewater-${TIDEWATER_VERSION}-linux-x86_64.AppImage"
      - name: Check the AppImage starts
        run: |
          # No FUSE on the runner: the AppImage unpacks itself to run.
          got=$(APPIMAGE_EXTRACT_AND_RUN=1 "dist/tidewater-${TIDEWATER_VERSION}-linux-x86_64.AppImage" --version)
          echo "$got"
          [ "$got" = "tidewater $TIDEWATER_VERSION" ] || { echo "expected 'tidewater $TIDEWATER_VERSION'"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error

  macos:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-26
    env:
      TIDEWATER_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain and both Mac targets
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build both architectures
        run: |
          cargo build --release --locked -p tidewater-client --target aarch64-apple-darwin
          cargo build --release --locked -p tidewater-client --target x86_64-apple-darwin
      - name: Make the universal binary and the disk image
        run: |
          mkdir -p dist
          lipo -create -output dist/tidewater \
            target/aarch64-apple-darwin/release/tidewater target/x86_64-apple-darwin/release/tidewater
          packaging/macos/build-dmg.sh "$TIDEWATER_VERSION" dist/tidewater "dist/tidewater-${TIDEWATER_VERSION}-macos.dmg"
          rm dist/tidewater
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      TIDEWATER_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p tidewater-client
      - name: Check the program has its icon
        shell: pwsh
        run: |
          # ExtractIconEx with index -1 counts the icons in the file's resources: 0 means the build script's icon is missing.
          Add-Type -Namespace Win32 -Name Icons -MemberDefinition '[DllImport("shell32.dll", CharSet = CharSet.Unicode)] public static extern uint ExtractIconEx(string file, int index, IntPtr[] large, IntPtr[] small, uint count);'
          $exe = (Resolve-Path target\release\tidewater.exe).Path
          $n = [Win32.Icons]::ExtractIconEx($exe, -1, $null, $null, 0)
          Write-Host "icons in tidewater.exe: $n"
          if ($n -lt 1) { throw "tidewater.exe has no icon resource" }
      - name: Build the installer
        run: |
          choco install innosetup --no-progress -y
          mkdir -p dist
          MSYS_NO_PATHCONV=1 "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            "/DAppVersion=${TIDEWATER_VERSION}" \
            "/DAppUrl=https://github.com/${TIDEWATER_REPO}" \
            "/DSourceExe=$(pwd -W)\\target\\release\\tidewater.exe" \
            "/DOutDir=$(pwd -W)\\dist" \
            "/DOutName=tidewater-${TIDEWATER_VERSION}-windows-x64-setup" \
            packaging/windows/tidewater.iss
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  # The Android APK (platform/android/build.sh --release). Signed with the release keystore from the repository secrets
  # so every release updates the one before it in place (docs/release.md). Without the secrets a real release skips
  # the APK with a note in the summary, and a dry run builds a debug-signed one to look at; neither fails the release.
  android:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    env:
      TIDEWATER_VERSION: ${{ needs.plan.outputs.version }}
      HAVE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - name: Decide whether to build
        id: gate
        env:
          PUBLISH: ${{ needs.plan.outputs.publish }}
        run: |
          if [ "$HAVE_KEYSTORE" != true ] && [ "$PUBLISH" = true ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Android APK skipped"
              echo
              echo "The Android APK was skipped: the signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) are not all set. The release goes out without it; see docs/release.md to set them."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$HAVE_KEYSTORE" != true ]; then
            echo "No signing secrets: this dry run builds a debug-signed APK to look at; it is never published." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.skip != 'true'
      - uses: actions/setup-java@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the pinned toolchain and the Android targets
        if: steps.gate.outputs.skip != 'true'
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android
      - name: Install the pinned Android NDK (platform/android/ndk-version)
        if: steps.gate.outputs.skip != 'true'
        run: |
          ndk=$(cat platform/android/ndk-version)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          grep -qx "Pkg.Revision = $ndk" "$ANDROID_HOME/ndk/$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        if: steps.gate.outputs.skip != 'true'
        with:
          tool: cargo-ndk@4.1.2
      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.skip != 'true'
      - name: Write the keystore
        if: steps.gate.outputs.skip != 'true' && env.HAVE_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Outside the checkout, and removed with the runner; only its path goes to later steps.
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "TIDEWATER_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build the APK
        if: steps.gate.outputs.skip != 'true'
        env:
          TIDEWATER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TIDEWATER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TIDEWATER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          platform/android/build.sh --release --version "$TIDEWATER_VERSION" \
            --out "dist/tidewater-${TIDEWATER_VERSION}-android.apk"
      - name: Check the signature
        if: steps.gate.outputs.skip != 'true'
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$apksigner" verify --verbose --print-certs "dist/tidewater-${TIDEWATER_VERSION}-android.apk" | tee apksigner.txt
          {
            echo "## Android APK"
            echo
            echo "- Signing key: $([ "$HAVE_KEYSTORE" = true ] && echo 'release keystore' || echo 'debug key (dry run only)')"
            grep -E 'certificate SHA-256 digest' apksigner.txt | head -n 1 | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  # The unsigned iOS app (platform/ios/package-ipa.sh): no signing, so people sideload it with their own Apple ID
  # (docs/design/ios.md). The release version goes into the app's CFBundleShortVersionString and CFBundleVersion.
  ios:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-26
    env:
      TIDEWATER_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Install the pinned toolchain and the iOS target
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Build the device library and the Xcode project
        run: platform/ios/build.sh device
      - name: Build and pack the unsigned app
        run: |
          mkdir -p dist
          platform/ios/package-ipa.sh --version "$TIDEWATER_VERSION" --out "dist/tidewater-${TIDEWATER_VERSION}-ios.ipa"
      - name: Check the package
        run: |
          unzip -q "dist/tidewater-${TIDEWATER_VERSION}-ios.ipa" -d "$RUNNER_TEMP/ipa"
          lipo -info "$RUNNER_TEMP/ipa/Payload/Tidewater.app/Tidewater"
          plutil -p "$RUNNER_TEMP/ipa/Payload/Tidewater.app/Info.plist" | grep -E 'CFBundle(Short)?Version'
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: dist/*.ipa
          if-no-files-found: error

  # The PS Vita VPK (platform/vita/build.sh): a pinned nightly with build-std and the Vita SDK. The release version
  # goes into the app's version (APP_VER, major and minor).
  vita:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    env:
      TIDEWATER_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/vitasdk
      - uses: Swatinem/rust-cache@v2
        with:
          key: vita-${{ hashFiles('platform/vita/nightly-version') }}
      - name: Build the VPK
        run: platform/vita/build.sh --version "$TIDEWATER_VERSION" --out "dist/tidewater-${TIDEWATER_VERSION}-vita.vpk"
      - name: Check the package
        run: unzip -l "dist/tidewater-${TIDEWATER_VERSION}-vita.vpk" | grep -F 'eboot.bin'
      - uses: actions/upload-artifact@v7
        with:
          name: vita
          path: dist/*.vpk
          if-no-files-found: error

  # Installs the built setup program silently, checks the installed program starts and reports the build's version,
  # then uninstalls. Runs on dry runs too.
  windows-smoke:
    needs: [plan, windows]
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist
      - name: Install, check, uninstall
        env:
          WANT: ${{ needs.plan.outputs.version }}
          MSYS_NO_PATHCONV: "1" # keep /VERYSILENT and friends as they are
        run: |
          setup=$(ls dist/tidewater-*-windows-x64-setup.exe)
          dir="$(cygpath -w "$RUNNER_TEMP")\\tw-smoke"
          "$setup" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="$dir" /LOG="$(cygpath -w "$RUNNER_TEMP")\\install.log"
          ls -l "$(cygpath -u "$dir")"
          # A silent install starts the game afterwards ("Start Tidewater"); stop it.
          taskkill /F /IM tidewater.exe || true
          got=$("$(cygpath -u "$dir")/tidewater.exe" --version)
          echo "$got"
          [ "$got" = "tidewater $WANT" ] || { echo "expected 'tidewater $WANT'"; exit 1; }
          "$(cygpath -u "$dir")/unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          # The uninstaller runs detached; wait for the program file to go.
          for _ in $(seq 1 30); do [ -e "$(cygpath -u "$dir")/tidewater.exe" ] || break; sleep 1; done
          if [ -e "$(cygpath -u "$dir")/tidewater.exe" ]; then echo "the uninstaller left the program behind"; exit 1; fi
          echo "installed, ran and uninstalled"

  publish:
    needs: [plan, linux, macos, windows, windows-smoke, android, ios, vita]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        run: |
          (cd dist && sha256sum tidewater-* > SHA256SUMS && cat SHA256SUMS)
          python3 .github/scripts/release.py notes > notes.md
      - name: Create the tag and the release
        run: |
          # --target makes the tag on the commit that was built; the tag is created here, with the release.
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "Tidewater $VERSION" --notes-file notes.md
