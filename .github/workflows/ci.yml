# Checks and release builds. No game data is used or cached here: the tests that need an installation or oracle
# traces are gated on TIDEWATER_INSTALL / TIDEWATER_ORACLE_TRACES, which are never set in CI, so they skip.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Runner images are named, not `-latest`, so Xcode and the Linux build's glibc change only when we bump them (with
# rust-toolchain.toml); the Android NDK is installed by version (platform/android/ndk-version). `--locked` fails the build if Cargo.lock is out of date instead of updating it.
jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install SDL 3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace

  build:
    name: build (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu runner, so the Linux build's glibc floor (2.35) stays low (docs/release.md).
          - os: ubuntu-22.04
            name: linux
            exe: ""
          - os: macos-26
            name: macos
            exe: ""
          - os: windows-2025
            name: windows
            exe: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install SDL 3 build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build the client and twtool
        run: cargo build --locked --release -p tidewater-client -p twtool
      - name: Pack and check the AppImage
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          packaging/linux/appimage.sh 0.0.0-ci target/release/tidewater dist/tidewater-linux-x86_64.AppImage
          # No FUSE on the runner: the AppImage unpacks itself to run.
          APPIMAGE_EXTRACT_AND_RUN=1 dist/tidewater-linux-x86_64.AppImage --version
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: tidewater-linux-appimage
          path: dist/tidewater-linux-x86_64.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: tidewater-${{ matrix.name }}
          path: target/release/tidewater${{ matrix.exe }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: twtool-${{ matrix.name }}
          path: target/release/twtool${{ matrix.exe }}
          if-no-files-found: error

  # The iOS app's static library for the Simulator (docs/design/ios.md): compiles SDL 3 and the shell for iOS and
  # links nothing, signs nothing. Kept to one target so it stays cheap.
  ios:
    name: ios (simulator library)
    needs: check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain and the iOS target
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Build the static library
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        run: cargo build --locked --release --target aarch64-apple-ios-sim -p tidewater-ios

  # The unsigned iOS app for a device, packed as an .ipa (docs/design/ios.md, "Install the unsigned IPA"): people
  # sideload it with their own Apple ID. Nothing is signed here and no secret is used.
  ios-ipa:
    name: ios (unsigned ipa)
    needs: check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Install the pinned toolchain and the iOS target
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Build the device library and the Xcode project
        run: platform/ios/build.sh device
      - name: Build and pack the unsigned app
        run: platform/ios/package-ipa.sh --out dist/Tidewater.ipa
      - name: Check the package
        run: |
          unzip -l dist/Tidewater.ipa | grep -F 'Payload/Tidewater.app/Info.plist'
          unzip -q dist/Tidewater.ipa -d "$RUNNER_TEMP/ipa"
          lipo -info "$RUNNER_TEMP/ipa/Payload/Tidewater.app/Tidewater"
      - uses: actions/upload-artifact@v7
        with:
          name: tidewater-ios-unsigned
          path: dist/Tidewater.ipa
          if-no-files-found: error

  # The PS Vita app (docs/design/vita.md): a pinned nightly with build-std and the Vita SDK, packed as a .vpk. A
  # separate job with its own caches, so the main checks stay as fast as they were.
  vita:
    name: vita (vpk)
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/vitasdk
      - uses: Swatinem/rust-cache@v2
        with:
          key: vita-${{ hashFiles('platform/vita/nightly-version') }}
      - name: Build the VPK
        run: platform/vita/build.sh --out dist/tidewater.vpk
      - name: Check the package
        run: |
          unzip -l dist/tidewater.vpk | grep -F 'eboot.bin'
          unzip -l dist/tidewater.vpk | grep -F 'sce_sys/param.sfo'
      - uses: actions/upload-artifact@v7
        with:
          name: tidewater-vita
          path: dist/tidewater.vpk
          if-no-files-found: error

  # The Android app's native library for one ABI (docs/design/android.md): compiles SDL 3 and the shell with the
  # pinned NDK, builds no APK and signs nothing. Kept to one ABI so it stays cheap.
  android:
    name: android (arm64 library)
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain and the Android target
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android
      - name: Install the pinned Android NDK (platform/android/ndk-version)
        run: |
          ndk=$(cat platform/android/ndk-version)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          grep -qx "Pkg.Revision = $ndk" "$ANDROID_HOME/ndk/$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2
      - uses: Swatinem/rust-cache@v2
      - name: Build libmain.so
        run: |
          export CMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          cargo ndk -t arm64-v8a -P 24 build --locked --release -p tidewater-android
