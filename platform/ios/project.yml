# The iOS app (docs/design/ios.md). `build.sh` builds the Rust static library for the device and the Simulator into
# build/<sdk>/ and runs `xcodegen generate` on this file; open Tidewater.xcodeproj afterwards.
#
# The app is the Rust shell (crates/ios) plus two small files: main.c (the entry, handing over to SDL) and picker.m
# (the document picker). Signing and the bundle identifier come from Config/Signing.xcconfig, which is yours.
name: Tidewater
options:
  bundleIdPrefix: dev.tidewater
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Tidewater.xcconfig
  Release: Config/Tidewater.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_OBJC_ARC: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    # The Rust library is built for arm64 only, on a device and in the Simulator on Apple silicon.
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
targets:
  Tidewater:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Tidewater
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        # Files dropped into the app's Documents folder in Finder or the Files app: the first-run screen scans them.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Landscape only, filling the screen (an iPad otherwise needs all four orientations).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIApplicationSupportsIndirectInputEvents: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        # An empty launch screen: without one iOS runs the app in a letterboxed compatibility size.
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        # The app uses only the system's own encryption (none of its own), which TestFlight asks about.
        ITSAppUsesNonExemptEncryption: false
        # SDL's controller support links CoreBluetooth (for Bluetooth LE controllers), which needs this text.
        NSBluetoothAlwaysUsageDescription: "Tidewater uses Bluetooth to talk to game controllers."
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        LIBRARY_SEARCH_PATHS: "$(PROJECT_DIR)/build/$(PLATFORM_NAME)"
        # -force_load: the Rust library's objects are all needed, and SDL's own live inside it.
        OTHER_LDFLAGS:
          - -force_load
          - $(PROJECT_DIR)/build/$(PLATFORM_NAME)/libtidewater_ios.a
          - -lc++
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        # The app icon: Sources/Assets.xcassets, drawn by packaging/icon/render.sh from packaging/icon/tidewater.svg.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: UIKit.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: Foundation.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: CoreMotion.framework
      - sdk: CoreHaptics.framework
      - sdk: GameController.framework
      # SDL's HIDAPI controller drivers (Steam Controller over Bluetooth LE); see docs/design/gamepad.md.
      - sdk: CoreBluetooth.framework
      - sdk: OpenGLES.framework
      - sdk: UniformTypeIdentifiers.framework
schemes:
  Tidewater:
    build:
      targets:
        Tidewater: all
    run:
      config: Debug
    archive:
      config: Release
