[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MPL-2.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
directories = "6"
tempfile = "3"
png = "0.18"
glam = "0.33"
socket2 = { version = "0.6", features = ["all"] }
flate2 = "1.1.10"
serde_json = "1.0.154"
# The touch chrome's icons (`crates/client/assets/touch-icons/*.svg`), drawn at the buttons' size. Pure Rust; the
# default text, font and raster-image support is not needed.
resvg = { version = "0.49", default-features = false }
# SDL 3 built from its source (CMake and a C compiler; no SDL install needed) and linked in, with only the audio,
# video, render, dialog and gamepad (joystick, HIDAPI) subsystems. Only the shell (`crates/client/src/shell/`) uses it.
sdl3-sys = { version = "0.7", features = ["build-from-source", "link-static", "no-default-subsystems", "sdl-audio", "sdl-render", "sdl-dialog", "sdl-joystick", "sdl-hidapi"] }
tidewater-client = { path = "crates/client" }
tidewater-formats = { path = "crates/formats" }
tidewater-import = { path = "crates/import" }
tidewater-sim = { path = "crates/sim" }
tidewater-replay = { path = "crates/replay" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }


# Debug info for dependencies is most of a debug build's size, and each agent worktree has its own
# target directory. Our own crates keep line tables, so backtraces still name files and lines.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
